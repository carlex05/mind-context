name: Bug report
description: Report a reproducible problem in the MindContext public beta.
title: "[Bug]: "
labels: ["bug", "beta-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing MindContext. Please do not include private note content, access tokens, Drive file IDs, or other personal information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem in a few sentences.
      placeholder: I expected… but instead…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Click…
        3. Type…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Editor
        - Reading view
        - Files
        - Search
        - Graph
        - Tags / Properties
        - Google Drive sync
        - Onboarding
        - Public website
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 154 · Windows 11
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots are welcome only when they contain no private knowledge.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed private note contents, credentials, tokens, Drive IDs, and personal data from this report.
          required: true

name: Improvement or feature
description: Suggest a product improvement for the MindContext public beta.
title: "[Idea]: "
labels: ["enhancement", "beta-feedback"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or friction before proposing the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like MindContext to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Writing / Markdown
        - Navigation / Tabs
        - Search
        - Graph / Connections
        - Google Drive / Sync
        - Mobile UX
        - Privacy
        - Local AI
        - Plugins
        - Public website / Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle this today?
  - type: checkboxes
    id: portable
    attributes:
      label: Product principles
      options:
        - label: This idea can preserve Markdown/user-owned files as the source of truth.

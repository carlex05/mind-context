name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || secrets.PUBLIC_SITE_URL }}
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment configuration
        shell: bash
        run: |
          missing=0

          if [[ -z "$PUBLIC_SITE_URL" ]]; then
            echo "::error::Missing PUBLIC_SITE_URL. Configure it as a repository or github-pages environment variable."
            missing=1
          fi

          if [[ -z "$VITE_GOOGLE_CLIENT_ID" ]]; then
            echo "::error::Missing GOOGLE_CLIENT_ID. Configure it as a repository or github-pages environment variable."
            missing=1
          fi

          if [[ -z "$PUBLIC_GA_MEASUREMENT_ID" ]]; then
            echo "::warning::GA_MEASUREMENT_ID is not configured. The site will deploy without analytics."
          fi

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

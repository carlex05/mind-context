<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MindContext — Constellation. A Markdown-first second brain stored in your own Google Drive."
    />
    <meta name="application-name" content="MindContext" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0A0D16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F8FC" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="./brand/favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("mindcontext.theme");
          const preference =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          const dark =
            preference === "dark" ||
            (preference === "system" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themePreference = preference;
        } catch {}
      })();
    </script>
    <title>MindContext — Constellation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
